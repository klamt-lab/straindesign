{% set version = '1.19' %}

package:
  name: straindesign
  version: "{{ version }}"

source:
  path: ..
  # git_url: https://github.com/klamt-lab/straindesign
  # git_rev: v{{ version }}

requirements:
  build:
    - python
    - pip
    - setuptools >=77
    - wheel
  run:
    - python
    - scipy
    - matplotlib-base
    - psutil
    - numpy
    - pandas
    - optlang
    - swiglpk
    - pyscipopt
    - conda-forge:cobra

build:
  noarch: python
  number: 0  # NOTE: increment for new build/set to zero for new version
  script: pip install . --no-deps --no-build-isolation

test:
  imports:
    - straindesign

about:
  home:  https://github.com/klamt-lab/straindesign
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Computational strain design package for the COBRApy framework.
  doc_url: https://github.com/klamt-lab/straindesign
  dev_url: https://github.com/klamt-lab/straindesign

